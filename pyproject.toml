[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homoppi"
version = "0.1.0"
description = "Homology-based protein-protein interaction prediction via interolog mapping and domain-domain interactions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jiajun Li", email = "jiajunli.phd@gmail.com" }]
keywords = [
    "bioinformatics",
    "protein-protein interaction",
    "interolog",
    "domain-domain interaction",
    "PPI",
    "homology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
homoppi = "homoppi.cli:app"

[project.urls]
Homepage = "https://github.com/ChiaChunL/homoppi"
Repository = "https://github.com/ChiaChunL/homoppi"
Issues = "https://github.com/ChiaChunL/homoppi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/homoppi"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer option declarations are clearer on one line
"src/homoppi/cli.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
