name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install BLAST+ and HMMER (bioconda)
        timeout-minutes: 10
        # apt mirrors on hosted runners hang too often; bioconda is the
        # project's documented install channel anyway.
        run: |
          curl -Ls --retry 3 https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          ./bin/micromamba create -y -q -p "$HOME/bio-tools" -c conda-forge -c bioconda blast hmmer
          echo "$HOME/bio-tools/bin" >> "$GITHUB_PATH"
      - name: Verify tools
        run: which blastp makeblastdb hmmscan hmmbuild hmmpress
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
